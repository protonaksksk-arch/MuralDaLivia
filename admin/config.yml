backend:
  name: git-gateway
  branch: main

media_folder: "imagens"
public_folder: "/imagens"

collections:
  - name: "posts"
    label: "Postagens"
    folder: "posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título / Texto", name: "title", widget: "string" }
      - { label: "Foto", name: "image", widget: "image" }
      - { label: "Link", name: "link", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime" }
